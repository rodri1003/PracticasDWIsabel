<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tareas Interactiva</title>
  <!-- Enlazamos el archivo CSS externo -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Contenedor principal -->
  <div id="contenedor">
    <h1>Mi Lista de Tareas</h1>
    <!-- Campo de entrada para agregar nuevas tareas -->
    <input type="text" id="nuevaTarea" placeholder="Escribe una nueva tarea">
    <!-- Botón para agregar la tarea -->
    <button id="agregarBtn">Agregar Tarea</button>
    <!-- Lista donde se mostrarán las tareas -->
    <ul id="listaTareas"></ul>
  </div>
  <!-- Enlazamos el archivo JavaScript externo -->
  <script src="./ejemplo.js"></script>
</body>
</html>
